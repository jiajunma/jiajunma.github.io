<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma Jiajun</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #52616b;
      --line: #d8dee6;
      --accent: #005bbb;
      --bg: #ffffff;
      --soft: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
    }
    main {
      width: min(920px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 64px 0;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p {
      max-width: 680px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.08rem;
    }
    .section {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      margin-top: 36px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 1.35rem;
    }
    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }
    .course {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      text-decoration: none;
    }
    .course strong {
      display: block;
      color: var(--ink);
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .course span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Ma Jiajun</h1>
    <p>Course materials and public teaching resources.</p>

    <section class="section">
      <h2>Courses</h2>
      <a class="course" href="dsa5210/">
        <strong>DSA5210 AI for Mathematics</strong>
        <span>Lecture slides and course materials</span>
      </a>
    </section>
  </main>
</body>
</html>
