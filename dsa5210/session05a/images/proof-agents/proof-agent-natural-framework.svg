<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Natural language proof framework for proof agents">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#0b4f9c"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#b45309"/>
    </marker>
    <style>
      .title{font:700 33px Arial,sans-serif;fill:#0f2742}
      .box-title{font:700 21px Arial,sans-serif;fill:#0f2742}
      .box-title-light{font:700 21px Arial,sans-serif;fill:#ffffff}
      .box-text{font:17px Arial,sans-serif;fill:#20364f}
      .small{font:15px Arial,sans-serif;fill:#334155}
      .code{font:16px Menlo,Consolas,monospace;fill:#e5edff}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">Natural-language proof framework</text>
  <text x="600" y="82" text-anchor="middle" class="box-text">Use proof text as a planning and grounding layer, not as the final certificate.</text>

  <rect x="58" y="142" width="226" height="128" rx="14" fill="#f8fbff" stroke="#0b4f9c" stroke-width="4"/>
  <text x="171" y="176" text-anchor="middle" class="box-title">Problem text</text>
  <text x="171" y="210" text-anchor="middle" class="box-text">theorem, definitions,</text>
  <text x="171" y="234" text-anchor="middle" class="box-text">human context</text>

  <rect x="356" y="110" width="218" height="110" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="4"/>
  <text x="465" y="142" text-anchor="middle" class="box-title">Retrieve</text>
  <text x="465" y="174" text-anchor="middle" class="box-text">definitions, lemmas,</text>
  <text x="465" y="198" text-anchor="middle" class="box-text">similar proofs</text>

  <rect x="356" y="274" width="218" height="110" rx="14" fill="#ecfdf3" stroke="#047857" stroke-width="4"/>
  <text x="465" y="306" text-anchor="middle" class="box-title">Generate</text>
  <text x="465" y="338" text-anchor="middle" class="box-text">next step, proof sketch,</text>
  <text x="465" y="362" text-anchor="middle" class="box-text">subgoal, lemma idea</text>

  <rect x="656" y="110" width="218" height="110" rx="14" fill="#f5f3ff" stroke="#4f46e5" stroke-width="4"/>
  <text x="765" y="142" text-anchor="middle" class="box-title">Critic</text>
  <text x="765" y="174" text-anchor="middle" class="box-text">is it grounded?</text>
  <text x="765" y="198" text-anchor="middle" class="box-text">is there a gap?</text>

  <rect x="656" y="274" width="218" height="110" rx="14" fill="#eef6ff" stroke="#0b4f9c" stroke-width="4"/>
  <text x="765" y="306" text-anchor="middle" class="box-title">Search state</text>
  <text x="765" y="338" text-anchor="middle" class="box-text">branches, failed ideas,</text>
  <text x="765" y="362" text-anchor="middle" class="box-text">promising lemmas</text>

  <rect x="944" y="166" width="206" height="164" rx="14" fill="#111827" stroke="#475569" stroke-width="4"/>
  <text x="1047" y="202" text-anchor="middle" class="box-title-light">Output</text>
  <text x="1047" y="238" text-anchor="middle" class="code">informal proof</text>
  <text x="1047" y="264" text-anchor="middle" class="code">proof sketch</text>
  <text x="1047" y="290" text-anchor="middle" class="code">subgoals</text>

  <g stroke="#0b4f9c" stroke-width="3.6" fill="none" marker-end="url(#arrow)">
    <path d="M284 206 H348"/>
    <path d="M284 238 C316 284 324 329 348 329"/>
    <path d="M765 220 V266"/>
    <path d="M574 306 C616 276 615 192 648 174"/>
    <path d="M874 192 C912 192 922 210 938 230"/>
    <path d="M874 330 C914 330 922 300 938 282"/>
    <path d="M465 220 V266"/>
  </g>
  <g stroke="#b45309" stroke-width="3.6" fill="none" marker-end="url(#arrow-feedback)">
    <path d="M656 360 C624 402 592 402 574 362"/>
  </g>
  <text x="610" y="424" text-anchor="middle" class="small">revise next step</text>

  <rect x="168" y="438" width="864" height="54" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="3.5"/>
  <text x="600" y="471" text-anchor="middle" class="box-text">The natural layer can guide retrieval and decomposition, but correctness still needs human review or formal checking.</text>
</svg>
