<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Theorem retrieval example for list length append">
  <rect width="1200" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#0b5cad"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102a43}
      .head{font:700 22px Arial,sans-serif;fill:#102a43}
      .head-light{font:700 22px Arial,sans-serif;fill:#ffffff}
      .text{font:16px Arial,sans-serif;fill:#334e68}
      .code{font:16px Menlo,Consolas,monospace;fill:#dbeafe}
      .darkcode{font:16px Menlo,Consolas,monospace;fill:#102a43}
      .small{font:14px Arial,sans-serif;fill:#526d82}
    </style>
  </defs>

  <text x="600" y="54" text-anchor="middle" class="title">Retrieval Turns Search Into Recognition</text>

  <rect x="70" y="118" width="300" height="150" rx="16" fill="#f7fbff" stroke="#2f80ed" stroke-width="3"/>
  <text x="220" y="154" text-anchor="middle" class="head">Current goal</text>
  <text x="104" y="198" class="darkcode">length (xs ++ ys)</text>
  <text x="104" y="226" class="darkcode">  = length xs + length ys</text>

  <rect x="450" y="118" width="300" height="150" rx="16" fill="#fff4e6" stroke="#f2994a" stroke-width="3"/>
  <text x="600" y="154" text-anchor="middle" class="head">Query built by agent</text>
  <text x="600" y="194" text-anchor="middle" class="text">symbols: length, append</text>
  <text x="600" y="222" text-anchor="middle" class="text">shape: equality over lists</text>

  <rect x="830" y="92" width="300" height="205" rx="16" fill="#e8f8e8" stroke="#219653" stroke-width="3"/>
  <text x="980" y="128" text-anchor="middle" class="head">Retrieved memory</text>
  <text x="875" y="172" class="darkcode">List.length_append</text>
  <text x="875" y="202" class="darkcode">simp lemmas for append</text>
  <text x="875" y="232" class="darkcode">Nat.add_assoc</text>
  <text x="875" y="262" class="darkcode">nearby examples</text>

  <g stroke="#0b5cad" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M370 193 H442"/>
    <path d="M750 193 H822"/>
  </g>

  <rect x="205" y="380" width="330" height="140" rx="16" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="370" y="416" text-anchor="middle" class="head-light">Without retrieval</text>
  <text x="242" y="456" class="code">try induction?</text>
  <text x="242" y="484" class="code">try rewriting?</text>
  <text x="242" y="512" class="code">many blind branches</text>

  <rect x="665" y="380" width="330" height="140" rx="16" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="830" y="416" text-anchor="middle" class="head-light">With retrieval</text>
  <text x="702" y="456" class="code">simpa using</text>
  <text x="702" y="484" class="code">  List.length_append xs ys</text>

  <g stroke="#219653" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M980 297 C980 346 878 346 840 374"/>
  </g>

  <text x="600" y="592" text-anchor="middle" class="small">The hard part may be finding the right theorem name, not inventing the proof from scratch.</text>
</svg>
