<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Natural language proof and Lean proof checking comparison">
  <rect width="1200" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#0b5cad"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102a43}
      .head{font:700 22px Arial,sans-serif;fill:#102a43}
      .smallhead{font:700 18px Arial,sans-serif;fill:#102a43}
      .text{font:16px Arial,sans-serif;fill:#334e68}
      .code{font:16px Menlo,Consolas,monospace;fill:#dbeafe}
      .white{fill:#ffffff}
    </style>
  </defs>

  <text x="600" y="54" text-anchor="middle" class="title">Two Verification Cultures</text>

  <rect x="70" y="110" width="460" height="430" rx="18" fill="#f7fbff" stroke="#2f80ed" stroke-width="3"/>
  <text x="300" y="150" text-anchor="middle" class="head">Natural-language route</text>

  <rect x="120" y="185" width="360" height="86" rx="12" fill="#ffffff" stroke="#d4ddff" stroke-width="3"/>
  <text x="300" y="218" text-anchor="middle" class="smallhead">Problem text</text>
  <text x="300" y="242" text-anchor="middle" class="text">"The sum of the first n odd</text>
  <text x="300" y="264" text-anchor="middle" class="text">numbers is n^2."</text>

  <rect x="120" y="306" width="360" height="104" rx="12" fill="#e8f8e8" stroke="#219653" stroke-width="3"/>
  <text x="300" y="334" text-anchor="middle" class="smallhead">Paragraph proof</text>
  <text x="300" y="360" text-anchor="middle" class="text">Induct on n.</text>
  <text x="300" y="384" text-anchor="middle" class="text">The step adds 2n+1 and</text>
  <text x="300" y="408" text-anchor="middle" class="text">gives (n+1)^2.</text>

  <rect x="120" y="440" width="360" height="70" rx="12" fill="#fff4e6" stroke="#f2994a" stroke-width="3"/>
  <text x="300" y="468" text-anchor="middle" class="smallhead">Text-level judgment</text>
  <text x="300" y="492" text-anchor="middle" class="text">plausible, relevant, coherent</text>

  <g stroke="#0b5cad" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M300 271 V298"/>
    <path d="M300 410 V432"/>
  </g>

  <rect x="670" y="110" width="460" height="430" rx="18" fill="#f8f8ff" stroke="#6c63ff" stroke-width="3"/>
  <text x="900" y="150" text-anchor="middle" class="head">Lean route</text>

  <rect x="720" y="175" width="360" height="106" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="745" y="210" class="code">example (n : Nat) :</text>
  <text x="745" y="236" class="code">  (Finset.range n).sum</text>
  <text x="745" y="262" class="code">    (fun i =&gt; 2*i+1)=n^2 := by</text>

  <rect x="720" y="320" width="360" height="86" rx="12" fill="#ffffff" stroke="#d4ddff" stroke-width="3"/>
  <text x="900" y="350" text-anchor="middle" class="smallhead">Candidate proof</text>
  <text x="900" y="374" text-anchor="middle" class="text">retrieved lemmas, induction,</text>
  <text x="900" y="396" text-anchor="middle" class="text">Lean feedback, algebra repair</text>

  <rect x="720" y="455" width="360" height="70" rx="12" fill="#e8f8e8" stroke="#219653" stroke-width="3"/>
  <text x="900" y="483" text-anchor="middle" class="smallhead">Machine-checked artifact</text>
  <text x="900" y="507" text-anchor="middle" class="text">all goals closed, no sorry</text>

  <g stroke="#0b5cad" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M900 281 V312"/>
    <path d="M900 406 V447"/>
  </g>

  <rect x="520" y="260" width="160" height="98" rx="16" fill="#fff4e6" stroke="#e07000" stroke-width="3"/>
  <text x="600" y="292" text-anchor="middle" class="smallhead">Proof agent</text>
  <text x="600" y="318" text-anchor="middle" class="text">aligns</text>
  <text x="600" y="340" text-anchor="middle" class="text">indexing</text>

  <g stroke="#0b5cad" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M480 350 C520 350 520 309 512 309"/>
    <path d="M680 309 C710 309 710 228 720 228"/>
  </g>

  <text x="600" y="598" text-anchor="middle" class="text">Natural proofs hide indexing; Lean-centered agents must expose Finset.range and let feedback guide repairs.</text>
</svg>
