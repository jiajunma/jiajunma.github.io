    :root {

      border-collapse: collapse;
      font-size: 1rem;
    }
    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);

      vertical-align: top;

    th {
      color: var(--muted);
      font-weight: 650;
      background: var(--soft);

    td:first-child {
      width: 4.5rem;
      font-weight: 650;
    }
    .links {
      white-space: nowrap;
    }
    .links a + a {
      margin-left: 0.8rem;

    @media (max-width: 620px) {
      table, thead, tbody, tr, th, td { display: block; }

      tr {

      td {
        border: 0;
        padding: 3px 0;
      }
      td:first-child { width: auto; }
      .links { white-space: normal; margin-top: 8px; }
