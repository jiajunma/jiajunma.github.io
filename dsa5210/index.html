  <style>
    :root {

      --bg: #ffffff;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      color: var(--muted);
      font-size: 1.08rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }
    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 650;
      background: var(--soft);
    }
    td:first-child {
      width: 4.5rem;
      font-weight: 650;
    }
    .links {
      white-space: nowrap;
    }
    .links a + a {
      margin-left: 0.8rem;
    }
    @media (max-width: 620px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      td {
        border: 0;
        padding: 3px 0;
      }
      td:first-child { width: auto; }
      .links { white-space: normal; margin-top: 8px; }
    }
  </style>
