<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA5210 AI for Mathematics</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #52616b;
      --line: #d8dee6;
      --accent: #005bbb;
      --bg: #ffffff;
      --soft: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
    }
    main {
      width: min(980px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 54px 0;
    }
    nav { margin-bottom: 30px; }
    nav a, a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .lead {
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 1.08rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }
    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 650;
      background: var(--soft);
    }
    td:first-child {
      width: 4.5rem;
      font-weight: 650;
    }
    .links {
      white-space: nowrap;
    }
    .links a + a {
      margin-left: 0.8rem;
    }
    @media (max-width: 620px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      td {
        border: 0;
        padding: 3px 0;
      }
      td:first-child { width: auto; }
      .links { white-space: normal; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <nav><a href="../">Home</a></nav>
    <h1>DSA5210 AI for Mathematics</h1>
    <p class="lead">National University of Singapore, DSA Master course.</p>

    <table>
      <thead>
        <tr>
          <th>Lecture</th>
          <th>Topic</th>
          <th>Materials</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>L01</td>
          <td>General introduction to AI for Mathematics</td>
          <td class="links">
            <a href="session01/">Slides</a>
            <a href="session01/session01.pdf">PDF</a>
          </td>
        </tr>
        <tr>
          <td>L02</td>
          <td>Type theory and Lean</td>
          <td class="links">
            <a href="session02/">Slides</a>
            <a href="session02/session02.pdf">PDF</a>
          </td>
        </tr>
        <tr>
          <td>L04</td>
          <td>Natural-Language Reasoning AI Tools for Mathematics</td>
          <td class="links">
            <a href="session04/">Slides</a>
            <a href="session04/session04.pdf">PDF</a>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
